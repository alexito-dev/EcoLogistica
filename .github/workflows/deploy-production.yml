name: Deploy production

# Despliegue continuo (Sprint 4). Solo se despliega código que pasó CI y Tests. Las credenciales se leen de
# GitHub Secrets; ninguna se escribe en el repositorio. El destino es el servicio de hosting que dispone de
# «deploy hooks» (por ejemplo Render o Railway): cada hook es una URL secreta que, al recibir un POST, compila y
# publica la última versión del repositorio en ese servicio.
#
# La imagen (Dockerfile) contiene la API y la interfaz: un solo servicio y un solo origen (requisito de las cookies
# SameSite=Strict). Configuración en Settings → Secrets and variables → Actions:
#   Variable  PRODUCTION_URL       (URL pública, https://…)
#   Y UNA de estas dos formas de publicar:
#   a) VPS por SSH (deploy/vps/desplegar.sh): Secret DEPLOY_SSH_KEY (clave privada), Variable DEPLOY_SERVER
#      (por defecto root@169.58.235.118) y Variable DEPLOY_HOST (por defecto ecologistica.arno.services).
#   b) Hosting con deploy hook (ver render.yaml): Secret DEPLOY_HOOK_BACKEND.
#   Opcionales: DEPLOY_HOOK_FRONTEND y PRODUCTION_API_URL, solo si la interfaz y la API se alojan por separado.
# Mientras falten los obligatorios, el flujo valida el código y declara explícitamente que NO desplegó.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production # nunca dos despliegues a la vez; el segundo espera al primero
  cancel-in-progress: false

jobs:
  ci:
    name: Validar (CI)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  tests:
    name: Validar (Tests)
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  configuracion:
    name: Comprobar configuración de producción
    runs-on: ubuntu-latest
    outputs:
      listo: ${{ steps.verificar.outputs.listo }}
    env:
      DEPLOY_HOOK_BACKEND: ${{ secrets.DEPLOY_HOOK_BACKEND }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - id: verificar
        run: |
          faltan=""
          { [ -n "$DEPLOY_HOOK_BACKEND" ] || [ -n "$DEPLOY_SSH_KEY" ]; } || faltan="$faltan DEPLOY_SSH_KEY_o_DEPLOY_HOOK_BACKEND"
          [ -n "$PRODUCTION_URL" ] || faltan="$faltan PRODUCTION_URL"
          if [ -n "$faltan" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "### Despliegue omitido" >> "$GITHUB_STEP_SUMMARY"
            echo "El código pasó CI y Tests, pero **no se desplegó**: faltan en el repositorio:$faltan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

  desplegar:
    name: Desplegar a producción
    needs: [ci, tests, configuracion]
    if: needs.configuracion.outputs.listo == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_HOOK_BACKEND: ${{ secrets.DEPLOY_HOOK_BACKEND }}
      DEPLOY_HOOK_FRONTEND: ${{ secrets.DEPLOY_HOOK_FRONTEND }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SERVER: ${{ vars.DEPLOY_SERVER || 'root@169.58.235.118' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'ecologistica.arno.services' }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar al VPS por SSH (el contenedor aplica las migraciones de Alembic al arrancar)
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${DEPLOY_SERVER#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          export DEPLOY_SSH_OPTS="-i $HOME/.ssh/id_deploy"
          bash deploy/vps/desplegar.sh
      - name: Desplegar con el deploy hook del hosting
        if: env.DEPLOY_SSH_KEY == '' && env.DEPLOY_HOOK_BACKEND != ''
        run: curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_HOOK_BACKEND" > /dev/null
      - name: Esperar a que la API publicada responda /health
        run: |
          for intento in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "$PRODUCTION_API_URL/health" | grep -q '"status":"ok"'; then
              echo "API disponible tras $intento intento(s)"; exit 0
            fi
            sleep 10
          done
          echo "::error::La API no respondió /health en 5 minutos"; exit 1
      - name: Desplegar la interfaz por separado (solo si se configuró un servicio aparte)
        if: env.DEPLOY_HOOK_FRONTEND != ''
        run: curl --fail --silent --show-error --max-time 60 -X POST "$DEPLOY_HOOK_FRONTEND" > /dev/null

  humo:
    name: Prueba de humo posterior al despliegue
    needs: desplegar
    runs-on: ubuntu-latest
    env:
      ECO_BASE_URL: ${{ vars.PRODUCTION_URL }}
      ECO_API_URL: ${{ vars.PRODUCTION_API_URL || vars.PRODUCTION_URL }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Disponibilidad y resiliencia contra producción
        working-directory: frontend
        run: npx playwright test e2e/disponibilidad.spec.ts --project=chromium
      - name: Publicar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-produccion
          path: frontend/playwright-report
          retention-days: 30
          if-no-files-found: warn

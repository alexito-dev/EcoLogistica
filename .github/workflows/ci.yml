name: CI

on:
  push:
    branches: [main, "sprint-*/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas con cobertura
        run: pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Benchmark EN-001 (semilla 2026, máximo 45 s)
        run: python scripts/benchmark_rutas.py 25 50 100 150

  migraciones:
    name: Migraciones (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: ecologistica_test
          POSTGRES_USER: eco_ci
          POSTGRES_PASSWORD: eco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eco_ci -d ecologistica_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://eco_ci:eco_ci@localhost:5432/ecologistica_test
      ECO_TEST_DATABASE_URL: postgresql+psycopg://eco_ci:eco_ci@localhost:5432/ecologistica_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Aplicar, revertir y volver a aplicar
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Integración real de pedidos y flota contra PostGIS aislado
        run: pytest -q tests/integracion/test_postgis.py

  frontend:
    name: Frontend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  openspec:
    name: Especificaciones (OpenSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict

  cobertura-integral:
    name: Cobertura real Python + TypeScript + PostGIS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: ecologistica_test
          POSTGRES_USER: eco_ci
          POSTGRES_PASSWORD: eco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eco_ci -d ecologistica_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://eco_ci:eco_ci@localhost:5432/ecologistica_test
      ECO_TEST_DATABASE_URL: postgresql+psycopg://eco_ci:eco_ci@localhost:5432/ecologistica_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Crear base PostGIS aislada para integración
        working-directory: backend
        run: alembic upgrade head
      - name: Medir cobertura de Python incluyendo PostGIS y ramas
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - name: Instalar frontend bloqueado por package-lock
        working-directory: frontend
        run: npm ci
      - name: Medir cobertura de frontend incluyendo ramas
        working-directory: frontend
        run: npx vitest run --coverage
      - name: Consolidar cobertura y publicar resumen con denominadores
        run: python scripts/reporte_cobertura.py
      - name: Conservar reportes XML y LCOV por commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-integral
          path: |
            backend/coverage.xml
            frontend/coverage/lcov.info
          retention-days: 30
          if-no-files-found: warn

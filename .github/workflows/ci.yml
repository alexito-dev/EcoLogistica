name: CI

# Integración continua (Sprint 5): estilo, análisis estático, compilación y validación de dependencias.
# Las pruebas (unitarias, integración y E2E) viven en tests.yml.

on:
  push:
    branches: [main, develop, "sprint-*/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_call: # lo reutiliza deploy-production.yml para desplegar solo código validado
  workflow_dispatch: # permite ejecutarlo a mano con el botón «Run workflow» de la pestaña Actions

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (análisis estático, dependencias y sintaxis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.17.6
      - name: Validar dependencias (sin conflictos ni paquetes rotos)
        run: pip check
      - name: Análisis estático con Ruff (errores de sintaxis y pyflakes)
        run: ruff check src tests scripts ../scripts --select E9,F
      - name: Compilación de bytecode (la API importa sin errores)
        run: |
          python -m compileall -q src
          PYTHONPATH=src python -c "import app.main"

  frontend:
    name: Frontend (tipos, lint, build y dependencias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias bloqueadas por package-lock
        run: npm ci
      - name: Validar árbol de dependencias
        run: npm ls --all > /dev/null
      - name: Auditoría de dependencias de producción (falla con severidad alta o crítica)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (oxlint)
        run: npm run lint
      - name: Compilar (tsc -b + build de producción)
        run: npm run build
      - name: Conservar el build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  openspec:
    name: Especificaciones (OpenSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes @fission-ai/openspec@1.13.2 validate --specs --strict

  higiene-repositorio:
    name: Higiene del repositorio (.gitignore y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin archivos residuales ni secretos versionados
        run: |
          set -u
          malos=$(git ls-files | grep -E '(^|/)(\.gitignore~|.*~|\.env|node_modules/.*|playwright-report/.*|test-results/.*)$' | grep -v '\.env\.example$' || true)
          if [ -n "$malos" ]; then
            echo "::error::Archivos que no deben versionarse:"
            echo "$malos"
            exit 1
          fi
          echo "Repositorio limpio: sin .gitignore~, .env, node_modules ni reportes temporales."

# Análisis estático de EcoLogística con SonarQube (Sprint 3).
# Antes de analizar, generar la cobertura:
#   backend:  pytest --cov=app --cov-report=xml:coverage.xml
#   frontend: npx vitest run --coverage
# Luego, desde la raíz: sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
sonar.projectKey=ecologistica
sonar.projectName=EcoLogística Huancayo
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,database/migrations
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**

sonar.python.version=3.10
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Servidor estático de referencia para el build de producción (Green IT: compresión y caché).
# Los archivos de /assets llevan hash en el nombre, por lo que pueden cachearse un año sin riesgo.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # brotli on; brotli_types ...;   # requiere ngx_brotli; se recomienda activarlo en el hosting real.

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /img/ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";   # index.html siempre se revalida (ETag)
    try_files $uri /index.html;
  }
}
